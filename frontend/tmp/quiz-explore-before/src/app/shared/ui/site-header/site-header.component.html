<header class="header">
  <div class="header__inner">
    <div class="header__leading">
      <app-brand />

      <nav class="header__navigation" aria-label="Điều hướng chính">
        @for (item of navigation; track item.href) {
          <a
            class="header__navigation-link"
            [class.header__navigation-link--active]="item.isActive"
            [href]="item.href"
          >
            {{ item.label }}
          </a>
        }
      </nav>
    </div>

    <div class="header__actions" aria-label="Tài khoản">
      <button
        class="header__action header__action--text"
        type="button"
        disabled
        title="Màn hình đăng nhập chưa được thiết kế"
      >
        Đăng nhập
      </button>
      <button
        class="header__action header__action--primary"
        type="button"
        disabled
        title="Màn hình tạo tài khoản chưa được thiết kế"
      >
        Tạo tài khoản
      </button>
    </div>

    <details class="header__mobile-menu">
      <summary aria-label="Mở trình đơn điều hướng">
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </summary>
      <div class="header__mobile-panel">
        <nav aria-label="Điều hướng di động">
          @for (item of navigation; track item.href) {
            <a [class.header__mobile-link--active]="item.isActive" [href]="item.href">
              {{ item.label }}
            </a>
          }
        </nav>
        <div class="header__mobile-actions">
          <button type="button" disabled>Đăng nhập</button>
          <button class="header__mobile-primary" type="button" disabled>Tạo tài khoản</button>
        </div>
      </div>
    </details>
  </div>
</header>
