<article class="quiz-card">
    <div>
        <div class="quiz-card__media">
            <img [ngSrc]="quiz().imageUrl ?? fallbackImage"
                    [alt]="quiz().title"
                    class="quiz-card__media-img"
                    fill/>
            <div class="quiz-card__media-gloss"></div>
        </div>

        <div class="quiz-card__labels">
            <span class="quiz-card__category">{{ quiz().categoryLabel }}</span>
            <span class="quiz-card__status">
        <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
        >
          <circle cx="12" cy="12" r="9"/>
          <path d="m8 12 3 3 5-6"/>
        </svg>
                {{ statusLabels[quiz().status] }}
      </span>
        </div>
        <h3>{{ quiz().title }}</h3>
        <p class="quiz-card__description">{{ quiz().description }}</p>
    </div>
    <div>
        <dl class="quiz-card__metadata">
            <div>
                <dt class="visually-hidden">Questions</dt>
                <dd>
                    <svg
                            width="17"
                            height="17"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.7"
                            aria-hidden="true"
                    >
                        <rect x="5" y="4" width="14" height="17" rx="2"/>
                        <path d="M9 3h6v3H9zM9 11h6M9 15h4"/>
                    </svg>
                    {{ quiz().questionCount }} questions
                </dd>
            </div>
            <div>
                <dt class="visually-hidden">Time limit</dt>
                <dd>
                    <svg
                            width="17"
                            height="17"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.7"
                            aria-hidden="true"
                    >
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M12 7v5l3 2"/>
                    </svg>
                    {{ quiz().durationMinutes }} minutes
                </dd>
            </div>
        </dl>
        <button
                class="quiz-card__detail"
                type="button"
                [attr.aria-label]="'View details: ' + quiz().title"
                (click)="detailRequested.emit(quiz())"
        >
            View details
            <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    aria-hidden="true"
            >
                <path d="m9 5 7 7-7 7"/>
            </svg>
        </button>
    </div>
</article>
