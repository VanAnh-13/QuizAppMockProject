<header class="header">
    <div class="header__inner">
        <app-brand/>

        <nav class="header__navigation" aria-label="Main navigation">
            <a class="header__navigation-link" routerLink="/" fragment="quiz-list">Explore
                quizzes</a>
            <button class="header__navigation-link" type="button"
                    (click)="information.open('about')">About
            </button>
            <button class="header__navigation-link" type="button"
                    (click)="information.open('contact')">Contact
            </button>
        </nav>

        <div class="header__trailing">
            <div class="header__actions">
                @if (session.user(); as user) {
                    <details #userMenu class="header__profile header__user-menu" (toggle)="onMenuToggle($event)">
                        <summary
                                class="header__avatar material-symbols-outlined"
                                aria-label="Account: {{ user.fullName || user.username }}"
                        >
                            person
                        </summary>
                        <div class="header__user-panel">
                            <div class="header__user-info">
                                <strong>{{ user.fullName || user.username }}</strong>
                                <span>Signed in</span>
                            </div>
                            <button
                                    class="header__logout-button"
                                    type="button"
                                    data-testid="header-logout"
                                    (click)="logout()"
                            >
                                <span class="material-symbols-outlined"
                                        aria-hidden="true">logout</span>
                                Log out
                            </button>
                        </div>
                    </details>
                } @else {
                    <a class="header__action header__action--text" routerLink="/login"
                            [queryParams]="{ returnUrl: returnAfterAuth() ?? router.url }">Log
                        in</a>
                    <a class="header__action header__action--primary" routerLink="/register"
                            [queryParams]="{ returnUrl: returnAfterAuth() ?? router.url }">
                        Sign up
                    </a>
                }
            </div>

            <details class="header__mobile-menu">
                <summary aria-label="Open account menu">
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                </summary>
                <div class="header__mobile-panel">
                    <nav aria-label="Mobile navigation">
                        <a routerLink="/" fragment="quiz-list">Explore quizzes</a>
                        <button type="button" (click)="information.open('about')">About</button>
                        <button type="button" (click)="information.open('contact')">Contact</button>
                    </nav>
                    <div class="header__mobile-actions">
                        @if (session.user(); as user) {
                            <div class="header__mobile-user">
                                <span class="header__avatar material-symbols-outlined"
                                        aria-hidden="true">person</span>
                                <div class="header__user-info">
                                    <strong>{{ user.fullName || user.username }}</strong>
                                    <span>Signed in</span>
                                </div>
                            </div>
                            <button type="button" (click)="logout()">Log out</button>
                        } @else {
                            <a routerLink="/login"
                                    [queryParams]="{ returnUrl: returnAfterAuth() ?? router.url }">Log
                                in</a>
                            <a class="header__mobile-primary" routerLink="/register"
                                    [queryParams]="{ returnUrl: returnAfterAuth() ?? router.url }">
                                Sign up
                            </a>
                        }
                    </div>
                </div>
            </details>
        </div>
    </div>
</header>

@if (isMenuOpen()) {
    <div class="header__page-backdrop" (click)="closeMenu()" aria-hidden="true"></div>
}

<app-site-info-dialog #information dialogId="header-information"/>
