<app-dialog
        #dialog
        dialogId="authentication"
        [title]="registering() ? 'Tạo tài khoản' : 'Đăng nhập'"
>
    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <label>
            Tên đăng nhập
            <input autocomplete="username" formControlName="username" required/>
        </label>

        @if (registering()) {
            <label>
                Họ và tên
                <input autocomplete="name" formControlName="fullName" required/>
            </label>

            <label>
                Email
                <input type="email" autocomplete="email" formControlName="email" required/>
            </label>
        }

        <label>
            Mật khẩu
            <input
                    type="password"
                    [autocomplete]="registering() ? 'new-password' : 'current-password'"
                    formControlName="password"
                    required
            />
        </label>

        @if (registering()) {
            <label>
                Xác nhận mật khẩu
                <input
                        type="password"
                        autocomplete="new-password"
                        formControlName="confirmPassword"
                        required
                />
            </label>
        }

        @if (registering() && form.hasError('passwordMismatch')) {
            <p role="alert">Mật khẩu xác nhận chưa khớp.</p>
        }

        @if (error(); as message) {
            <p role="alert">{{ message }}</p>
        }

        @if (notice(); as message) {
            <p role="status">{{ message }}</p>
        }

        <button type="submit" [disabled]="busy() || form.invalid">
            {{ busy() ? 'Đang xử lý…' : registering() ? 'Tạo tài khoản' : 'Đăng nhập' }}
        </button>
    </form>
</app-dialog>
