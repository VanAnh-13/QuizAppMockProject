<footer class="footer" id="thong-tin">
    <div class="footer__inner">
        <div class="footer__brand">
            <app-brand/>
            <p>
                © {{ currentYear }} QuizApp. Learn every day. Grow with every step.<br/>Design
                preview · Sample content
            </p>
        </div>
        <nav aria-label="Footer navigation">
            @for (item of navItems; track item.id) {
                <button type="button" (click)="information.open(item.id)">{{ item.label }}</button>
            }
        </nav>
    </div>
</footer>
<app-site-info-dialog #information dialogId="footer-information"/>
