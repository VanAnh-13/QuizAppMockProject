@if (service.request(); as request) {
    <dialog appModal
            class="confirmation-dialog"
            aria-labelledby="confirmation-title"
            aria-describedby="confirmation-message"
            (modalDismissed)="service.cancel()"
    >
        <div class="confirmation-dialog__icon material-symbols-outlined" aria-hidden="true">
            help_outline
        </div>
        <h2 id="confirmation-title">{{ request.title }}</h2>
        <p id="confirmation-message">{{ request.message }}</p>
        <div class="confirmation-dialog__actions">
            <button type="button" (click)="service.cancel()">
                {{ request.cancelLabel }}
            </button>
            <button type="button" autofocus (click)="service.accept()">
                {{ request.confirmLabel }}
            </button>
        </div>
    </dialog>
}
